name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_please:
    name: Release Please
    # Disabled during the Rust transition: the release-please config is
    # still Python-typed (release-type: python, bumps uv.lock and
    # src/shipit/version.py) and a created release triggers the PyPI
    # publish below. Re-enable after converting the config to the Rust
    # workspace (release-type: rust + a Rust distribution path).
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create or update release PR
        id: release
        continue-on-error: true
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo-url: ${{ github.repository }}

      - name: Wait before retry
        if: steps.release.outcome == 'failure'
        run: sleep 30

      - name: Create or update release PR (retry)
        id: release_retry
        if: steps.release.outcome == 'failure'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repo-url: ${{ github.repository }}

      - name: Trigger PyPI publish
        if: |
          steps.release.outputs.release_created == 'true' ||
          steps.release_retry.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag_name || steps.release_retry.outputs.tag_name }}
        run: |
          gh workflow run pypi-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG_NAME" \
            -f tag_name="$TAG_NAME"
