name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_and_e2e:
    name: Test + E2E
    uses: ./.github/workflows/reusable-test-e2e.yml

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test_and_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distribution
        run: uv build

      # - name: Upload artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: dist
      #     path: dist/
