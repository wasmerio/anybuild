name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Bytecode compile check
        run: uv run python -m compileall -q src tests

      - name: Run tests (excluding e2e)
        run: uv run pytest -m "not e2e" -q

  e2e:
    name: E2E (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Wasmer
        uses: wasmerio/setup-wasmer@v3.1

      - name: Verify toolchain
        run: |
          uv --version
          python --version
          wasmer --version
          docker --version

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run e2e tests
        run: |
          uv run pytest -m e2e -v tests/test_e2e.py -n 4 \
            -k "BuildMode.WasmerAndDocker and not cdn and not python-streamlit"

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test
      - e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distribution
        run: uv build

      # - name: Upload artifacts
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: dist
      #     path: dist/
