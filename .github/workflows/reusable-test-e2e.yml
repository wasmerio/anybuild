name: Reusable Test + E2E

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Bytecode compile check
        run: uv run python -m compileall -q src tests

      - name: Run mypy
        run: uv run mypy

      - name: Run tests (excluding e2e)
        run: uv run pytest -m "not e2e" -q

  e2e:
    name: E2E (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Set up Wasmer
        uses: wasmerio/setup-wasmer@v3.1
        with:
          version: v7.2.0-alpha.2

      - name: Verify toolchain
        run: |
          uv --version
          python --version
          wasmer --version
          docker --version

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run e2e tests
        run: |
          uv run pytest -m e2e -v tests/test_e2e.py -n 4 \
            -k "(BuildMode.Wasmer and not cdn and not python-streamlit)"
