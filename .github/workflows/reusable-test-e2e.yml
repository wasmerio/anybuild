name: Reusable Test + E2E

# Fully Rust-based testing: the gate job builds the workspace, runs the
# nextest gate suites against the committed fixtures (fixtures/,
# tests/plan_snapshots/ — no Python oracle needed at test time), and
# archives the e2e test binaries. The e2e matrix runs slices of the
# shipit-e2e crate against the debug binary.
#
# uv/Python appear in the e2e jobs only as the runtime toolchain of the
# example apps being built (uv/python for python examples), not as a test
# harness.

on:
  workflow_call:
    inputs:
      run_e2e:
        description: Run the E2E test job after unit tests pass.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Rust build + gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace (deny warnings)
        run: cargo build --workspace
        env:
          RUSTFLAGS: -D warnings

      - name: Run Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run gate suites
        run: cargo nextest run --workspace

      - name: Archive e2e test binaries
        run: cargo nextest archive -p shipit-e2e --archive-file shipit-e2e.tar.zst

      - name: Upload shipit binary
        uses: actions/upload-artifact@v4
        with:
          name: shipit-debug
          path: target/debug/shipit
          retention-days: 1
          if-no-files-found: error

      - name: Upload e2e archive
        uses: actions/upload-artifact@v4
        with:
          name: shipit-e2e-archive
          path: shipit-e2e.tar.zst
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E ${{ matrix.suite }} ${{ matrix.mode }}
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test
    strategy:
      fail-fast: false
      matrix:
        suite:
          - static
          - staticpython
          - staticnode1
          - staticnode2
          - python
          - node
          - php
        mode:
          - wasmer
        # Docker-mode slices, only for the suites that have such cases.
        include:
          - suite: static
            mode: wasmer_and_docker
          - suite: staticpython
            mode: wasmer_and_docker
          - suite: python
            mode: wasmer_and_docker
          - suite: php
            mode: wasmer_and_docker
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Toolchains for the example apps the suite builds (not a harness).
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install MySQL client + hugo
        # hugo builds run the local binary even in wasmer mode.
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client hugo

      - name: Set up Wasmer
        uses: wasmerio/setup-wasmer@v3.1
        with:
          version: v7.2.1

      - name: Download shipit binary
        uses: actions/download-artifact@v4
        with:
          name: shipit-debug
          path: shipit-bin

      - name: Download e2e archive
        uses: actions/download-artifact@v4
        with:
          name: shipit-e2e-archive

      - name: Verify toolchain
        run: |
          chmod +x shipit-bin/shipit
          uv --version
          python --version
          wasmer --version
          docker --version
          ./shipit-bin/shipit generate --help > /dev/null

      - name: Run e2e tests (Rust binary)
        env:
          SHIPIT_BIN: ${{ github.workspace }}/shipit-bin/shipit
        run: |
          cargo nextest run \
            --archive-file shipit-e2e.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile e2e --run-ignored all \
            -E 'test(/^${{ matrix.suite }}__${{ matrix.mode }}__/) and not test(/cdn|python_streamlit/)'
