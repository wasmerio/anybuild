name: Reusable Test + E2E

# Fully Rust-based testing: the gate job builds the workspace, runs the
# nextest gate suites against the committed fixtures (fixtures/,
# tests/plan_snapshots/ — no Python oracle needed at test time), and
# archives the e2e test binaries. The e2e matrix runs slices of the
# CLI e2e test target against the debug binary.
#
# uv/Python appear in the e2e jobs only as the runtime toolchain of the
# example apps being built (uv/python for python examples), not as a test
# harness.

on:
  workflow_call:
    inputs:
      run_e2e:
        description: Run the E2E test job after unit tests pass.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Rust build + gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build workspace (deny warnings)
        run: cargo build --workspace
        env:
          RUSTFLAGS: -D warnings

      - name: Run Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run gate suites
        run: cargo nextest run --workspace

      - name: Archive e2e test binaries
        run: cargo nextest archive -p anybuild-cli --test e2e --archive-file anybuild-e2e.tar.zst

      - name: Upload anybuild binary
        uses: actions/upload-artifact@v4
        with:
          name: anybuild-debug
          path: target/debug/anybuild
          retention-days: 1
          if-no-files-found: error

      - name: Upload e2e archive
        uses: actions/upload-artifact@v4
        with:
          name: anybuild-e2e-archive
          path: anybuild-e2e.tar.zst
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E ${{ matrix.suite }} ${{ matrix.mode }}
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test
    strategy:
      fail-fast: false
      matrix:
        suite:
          - static
          - staticpython
          - staticnode1
          - staticnode2
          - python
          - node
          - php
        mode:
          - wasmer
        # Docker-mode slices, only for the suites that have such cases.
        include:
          - suite: static
            mode: docker_runner
          - suite: staticpython
            mode: docker_runner
          - suite: staticnode1
            mode: docker_runner
          - suite: python
            mode: docker_runner
          - suite: node
            mode: docker_runner
          - suite: php
            mode: docker_runner
          - suite: static
            mode: wasmer_and_docker
          - suite: staticpython
            mode: wasmer_and_docker
          - suite: python
            mode: wasmer_and_docker
          - suite: php
            mode: wasmer_and_docker
          - suite: static
            mode: docker_builder_and_runner
          - suite: staticpython
            mode: docker_builder_and_runner
          - suite: python
            mode: docker_builder_and_runner
          - suite: php
            mode: docker_builder_and_runner
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Toolchains for the example apps the suite builds (not a harness).
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Bun
        if: ${{ matrix.suite == 'node' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install MySQL client + hugo
        # hugo builds run the local binary even in wasmer mode.
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client hugo

      - name: Set up Wasmer
        uses: wasmerio/setup-wasmer@v3.1
        with:
          version: v7.2.1

      - name: Verify Wasmer installation
        run: |
          if ! command -v wasmer &> /dev/null; then
            echo "setup-wasmer failed silently; installing wasmer v7.2.1 directly"
            WASMER_BIN_DIR="${WASMER_DIR:-$HOME/.wasmer}/bin"
            mkdir -p "${WASMER_DIR:-$HOME/.wasmer}"
            curl -sSfL https://github.com/wasmerio/wasmer/releases/download/v7.2.1/wasmer-linux-amd64.tar.gz \
              | tar -xz -C "${WASMER_DIR:-$HOME/.wasmer}"
            export PATH="$WASMER_BIN_DIR:$PATH"
            echo "$WASMER_BIN_DIR" >> "$GITHUB_PATH"
          fi
          wasmer --version
        if: runner.os == 'Linux' && runner.arch == 'X64'

      - name: Download anybuild binary
        uses: actions/download-artifact@v4
        with:
          name: anybuild-debug
          path: anybuild-bin

      - name: Download e2e archive
        uses: actions/download-artifact@v4
        with:
          name: anybuild-e2e-archive

      - name: Verify toolchain
        run: |
          chmod +x anybuild-bin/anybuild
          uv --version
          python --version
          docker --version
          ./anybuild-bin/anybuild generate --help > /dev/null

      - name: Verify Bun
        if: ${{ matrix.suite == 'node' }}
        run: bun --version

      - name: Run e2e tests (Rust binary)
        env:
          ANYBUILD_BIN: ${{ github.workspace }}/anybuild-bin/anybuild
        run: |
          cargo nextest run \
            --archive-file anybuild-e2e.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --profile e2e --run-ignored all \
            -E 'test(/^${{ matrix.suite }}__${{ matrix.mode }}__/) and not test(/cdn|python_streamlit/)'
