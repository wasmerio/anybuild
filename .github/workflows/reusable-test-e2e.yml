name: Reusable Test + E2E

# The CLI under test is the Rust binary: the `test` job builds it (debug)
# and runs the migration gate stack, then every e2e job downloads that
# binary and drives it through the pytest harness via SHIPIT_BIN. The
# Python implementation is no longer tested on CI; it only serves as the
# oracle for the cross-implementation fixtures and the CLI differential.

on:
  workflow_call:
    inputs:
      run_e2e:
        description: Run the E2E test job after unit tests pass.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Rust build + gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install dependencies (fixture oracle + e2e harness)
        run: uv sync --locked --dev

      - name: Build shipit (debug)
        run: cargo build --workspace
        env:
          RUSTFLAGS: -D warnings

      - name: Dump cross-implementation fixtures
        # The Rust snapshot/config tests *skip* when the manifest is
        # absent — fail here instead so a broken dump can't green-wash CI.
        run: |
          uv run python scripts/dump_rust_fixtures.py
          test -f target/rust-fixtures/manifest.json

      - name: Rust tests (snapshots, legacy files, config differential, units)
        run: cargo test --workspace

      - name: CLI differential (generate + plan, Rust vs Python oracle)
        run: uv run python scripts/cli_differential.py

      - name: Upload shipit binary
        uses: actions/upload-artifact@v4
        with:
          name: shipit-debug
          path: target/debug/shipit
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E ${{ matrix.suite }} (Rust binary)
    if: ${{ inputs.run_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test
    strategy:
      fail-fast: false
      matrix:
        suite:
          - static
          - staticpython
          - staticnode1
          - staticnode2
          - python
          - node
          - php
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Set up Wasmer
        uses: wasmerio/setup-wasmer@v3.1
        with:
          version: v7.2.0

      - name: Download shipit binary
        uses: actions/download-artifact@v4
        with:
          name: shipit-debug
          path: shipit-bin

      - name: Verify toolchain
        run: |
          chmod +x shipit-bin/shipit
          uv --version
          python --version
          wasmer --version
          docker --version
          ./shipit-bin/shipit generate --help > /dev/null

      - name: Install dependencies (pytest harness)
        run: uv sync --locked --dev

      - name: Run e2e tests (Rust binary via SHIPIT_BIN)
        env:
          SHIPIT_BIN: ${{ github.workspace }}/shipit-bin/shipit
        run: |
          uv run pytest -m "e2e and e2e_${{ matrix.suite }}" \
            -v tests/test_e2e.py -n 4 \
            -k "(BuildMode.Wasmer and not cdn and not hugo and not python-streamlit and not BuildMode.WasmerAndDocker)"
