name: Build Release Binaries

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref or commit to build; defaults to the caller SHA.
        required: false
        type: string
        default: ""
      expected_version:
        description: Version every binary must report; defaults to Cargo.toml.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            asset: anybuild-aarch64-apple-darwin.tar.gz
            binary: anybuild
            archive: tar
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            asset: anybuild-x86_64-apple-darwin.tar.gz
            binary: anybuild
            archive: tar
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: anybuild-aarch64-unknown-linux-musl.tar.gz
            binary: anybuild
            archive: tar
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            asset: anybuild-x86_64-unknown-linux-musl.tar.gz
            binary: anybuild
            archive: tar
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            asset: anybuild-x86_64-pc-windows-msvc.zip
            binary: anybuild.exe
            archive: zip

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Resolve expected version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.expected_version }}
        run: |
          manifest_version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          expected_version="$VERSION_INPUT"
          if [ -z "$expected_version" ]; then
            expected_version="$manifest_version"
          fi
          if [ "$expected_version" != "$manifest_version" ]; then
            echo "::error::Expected $expected_version, Cargo.toml has $manifest_version"
            exit 1
          fi
          echo "value=$expected_version" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build and smoke test
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          TARGET: ${{ matrix.target }}
          BINARY_NAME: ${{ matrix.binary }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET=12.0
          fi

          cargo build --locked --release \
            -p anybuild-cli --bin anybuild --target "$TARGET"

          binary="target/$TARGET/release/$BINARY_NAME"
          actual_version="$("$binary" --version)"
          if [ "$actual_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::Expected version $EXPECTED_VERSION, got $actual_version"
            exit 1
          fi

          mkdir -p staging dist
          cp "$binary" "staging/$BINARY_NAME"

      - name: Package Unix archive
        if: matrix.archive == 'tar'
        shell: bash
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: tar -C staging -czf "dist/$ASSET_NAME" anybuild

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          ASSET_NAME: ${{ matrix.asset }}
        run: Compress-Archive -Path staging/anybuild.exe -DestinationPath "dist/$env:ASSET_NAME"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
