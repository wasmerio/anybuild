[package]
name = "shipit-cli"
version = "0.17.2"
edition = "2021"
rust-version = "1.75"
authors = ["Wasmer Team <engineering@wasmer.io>"]
license = "MIT"
repository = "https://github.com/wasmerio/shipit"
homepage = "https://wasmer.io"
description = "Shipit CLI - build and serve projects anywhere"

[lib]
name = "shipit"
path = "src/lib.rs"

[[bin]]
name = "shipit"
path = "src/main.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.21"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# CLI
clap = { version = "4.4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.4"

# Logging
log = "0.4"
env_logger = "0.11"

# HTTP
reqwest = { version = "0.11", features = ["blocking", "json"] }

# File system
walkdir = "2.4"
ignore = "0.4"
tempfile = "3.8"

# Terminal UI
indicatif = "0.17"
console = "0.15"
syntect = "5.1"

# Starlark
starlark = "0.12"
allocative = "0.3"

# Configuration
figment = { version = "0.10", features = ["toml", "json", "yaml", "env"] }
dotenvy = "0.15"

# Utilities
regex = "1.10"
semver = "1.0"
which = "5.0"
shlex = "1.2"
glob = "0.3"
once_cell = "1.19"

[dev-dependencies]
# CLI testing
assert_cmd = "2.0"
predicates = "3.0"

# Property-based testing
proptest = "1.4"

# Mocking
mockall = "0.12"
mockito = "1.2"

# Async testing
tokio-test = "0.4"

# HTTP testing (reqwest already in main deps)
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }

# Test utilities
serial_test = "3.0" # For tests that can't run in parallel

# Benchmarking
criterion = "0.5"

[[bench]]
name = "benchmarks"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
