[workspace]
members = [
    "crates/anybuild",
    "crates/anybuild-common",
    "crates/anybuild-plan",
    "crates/anybuild-starlark",
    "crates/anybuild-providers",
    "crates/anybuild-cli",
    "crates/anybuild-run",
    "crates/anybuild-build",
    "crates/anybuild-e2e",
]
# `cargo build`/`cargo test` without flags skip the e2e crate; its tests
# are additionally #[ignore]d so `--workspace` runs skip them too. Run
# them explicitly with: cargo nextest run -p anybuild-e2e --run-ignored all
default-members = [
    "crates/anybuild",
    "crates/anybuild-common",
    "crates/anybuild-plan",
    "crates/anybuild-starlark",
    "crates/anybuild-providers",
    "crates/anybuild-cli",
    "crates/anybuild-run",
    "crates/anybuild-build",
]
resolver = "2"

[workspace.package]
version = "0.23.0"  # x-release-please-version
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
anybuild = { path = "crates/anybuild", version = "0.23.0" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
starlark = "0.14"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
allocative = "0.3"
thiserror = "2"

[profile.release]
lto = "thin"
