[workspace]
members = [
    "crates/anybuild",
    "crates/anybuild-cli",
]
resolver = "2"

[workspace.package]
version = "0.23.0"  # x-release-please-version
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
anybuild = { path = "crates/anybuild", version = "0.23.0" }  # x-release-please-version
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
starlark = "0.14"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.1"
allocative = "0.3"
thiserror = "2"

[profile.release]
lto = "thin"
