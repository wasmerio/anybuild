[workspace]
members = [
    "crates/shipit-plan",
    "crates/shipit-starlark",
    "crates/shipit-providers",
    "crates/shipit-cli",
    "crates/shipit-run",
    "crates/shipit-build",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
starlark = "0.14"
allocative = "0.3"

[profile.release]
lto = "thin"
