[package]
name = "anybuild-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/wasmerio/anybuild"
homepage = "https://github.com/wasmerio/anybuild"
description = "Anybuild build backends: local and docker step executors"

[features]
default = ["syntax-highlighting"]
# Monokai syntax highlighting for the config/manifest panels; without
# it the panels render plain with identical geometry.
syntax-highlighting = ["dep:syntect", "dep:two-face"]

[dependencies]
anyhow.workspace = true
base64 = "0.22"
indexmap.workspace = true
anybuild-common = { path = "../anybuild-common", version = "0.23.0" }
anybuild-plan = { path = "../anybuild-plan", version = "0.23.0" }
globset = "0.4"
shell-words = "1"
walkdir = "2"
ureq = "2"
syntect = { workspace = true, optional = true }
two-face = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
