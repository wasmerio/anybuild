[package]
name = "anybuild-run"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anybuild runners: local and wasmer"

[dependencies]
anyhow.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2 = "0.10"
shlex = "1"
toml_edit = "0.22"
anybuild-build = { path = "../anybuild-build", default-features = false }
anybuild-common = { path = "../anybuild-common" }
anybuild-plan = { path = "../anybuild-plan" }
anybuild-providers = { path = "../anybuild-providers" }

[dev-dependencies]
tempfile = "3"

[features]
default = ["syntax-highlighting"]
syntax-highlighting = ["anybuild-build/syntax-highlighting"]
