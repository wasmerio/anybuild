[package]
name = "anybuild-cli"
version = "0.28.2"
edition.workspace = true
license.workspace = true
repository = "https://github.com/wasmerio/anybuild"
homepage = "https://github.com/wasmerio/anybuild"
description = "Anybuild: detect, build, and serve projects"
default-run = "anybuild"

[[bin]]
name = "anybuild"
path = "src/main.rs"

[[bin]]
name = "shipit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
anybuild = { path = "../anybuild", version = "0.28.2" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
syntect = { workspace = true, optional = true }
two-face = { workspace = true, optional = true }
unicode-width.workspace = true

[dev-dependencies]
libc = "0.2"
regex = "1"
tempfile = "3"
ureq = "2"

[features]
default = ["syntax-highlighting"]
syntax-highlighting = ["dep:syntect", "dep:two-face"]
